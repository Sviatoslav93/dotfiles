gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  showBottomLine: true
  showCommandLog: false
  showIcons: true
  border: rounded
  theme:
    activeBorderColor:
      - "#7fb4ca"
      - bold
    inactiveBorderColor:
      - "#625e5a"
    searchingActiveBorderColor:
      - "#e6c384"
      - bold
    optionsTextColor:
      - "#7aa89f"
    selectedLineBgColor:
      - "#2d4f67"
    cherryPickedCommitBgColor:
      - "#282727"
    cherryPickedCommitFgColor:
      - "#938aa9"
    unstagedChangesColor:
      - "#e46876"
    defaultFgColor:
      - "#c5c9c5"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
os:
  editPreset: nvim
refresher:
  refreshInterval: 5
  fetchInterval: 60
update:
  method: never
notARepository: quit
keybinding:
  universal:
    quit: "q"
    return: "<esc>"
    prevItem: "k"
    nextItem: "j"
    prevPage: "K"
    nextPage: "J"
    scrollUpMain: "<c-u>"
    scrollDownMain: "<c-d>"
